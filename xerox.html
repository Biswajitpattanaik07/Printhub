<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PrintHub – Student Printing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--b:#2563eb;--p:#7c3aed;--ink:#1e1b4b;--mut:#6b7280;--ok:#16a34a;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(120deg,#eef2ff,#f5f3ff,#e0f2fe,#ede9fe);background-size:300% 300%;animation:bg 18s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:-1;animation:float 14s ease-in-out infinite}
.b1{width:320px;height:320px;background:#60a5fa;top:-90px;left:-90px}.b2{width:380px;height:380px;background:#a78bfa;bottom:-120px;right:-90px;animation-delay:-6s}
@keyframes float{50%{transform:translate(50px,40px) scale(1.12)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}100%{box-shadow:0 0 0 9px rgba(245,158,11,0)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sheet{0%{transform:translateY(40px);opacity:0}30%,70%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 4%;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(124,58,237,.12)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}.logo span{background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;color:transparent}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:14px}.brand small{color:var(--mut)}.brand.c{justify-content:center;font-size:22px;font-weight:800}
main{max-width:1000px;margin:26px auto;padding:0 14px}
.card{background:rgba(255,255,255,.9);border:1px solid #fff;border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 12px 34px rgba(79,70,229,.12);animation:up .6s var(--e) both}
h2{margin:0 0 14px;font-size:20px}small,.mut{color:var(--mut)}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid #e0e7ff;border-radius:12px;margin:6px 0 12px;font-size:16px;font-family:inherit;background:#fff;transition:.25s}
input:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(124,58,237,.15)}
label{font-size:13px;font-weight:600;color:var(--mut)}a{color:var(--p);font-weight:600}
.pw{position:relative}.pw input{padding-right:48px}.eye{position:absolute;right:6px;top:10px;border:0;background:none;font-size:20px;cursor:pointer;padding:6px}
.btn{background:linear-gradient(90deg,var(--b),var(--p));color:#fff;border:0;padding:13px 22px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;transition:.3s var(--e);box-shadow:0 6px 16px rgba(124,58,237,.28);text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}.btn.sm{padding:8px 12px;font-size:13px;box-shadow:none}.btn.ghost{background:#eef2ff;color:var(--b)}
.tabs,.seg{display:flex;background:#eef2ff;border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap;margin-bottom:14px}.tabs button,.seg button{flex:1;border:0;background:rgba(255,255,255,.8);padding:10px 8px;border-radius:10px;font-weight:700;cursor:pointer;color:#475569;transition:.3s;white-space:nowrap}
.tabs button.on,.seg button.on{background:linear-gradient(90deg,var(--b),var(--p));color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.drop{border:3px dashed #a5b4fc;border-radius:18px;padding:34px 14px;text-align:center;cursor:pointer;transition:.3s;background:#f8faff}.drop>div:first-child{display:inline-block;font-size:42px;animation:bob 2.6s infinite}
.drop:hover,.drop.on{background:#ede9fe;border-color:var(--p)}
.item{border:2px solid #e0e7ff;border-radius:16px;padding:14px;margin-bottom:12px;background:#fff;animation:pop .4s var(--e)}
.ih{display:flex;align-items:center;gap:12px;margin-bottom:10px}.fi{flex:1;min-width:0}.fi b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdfi{width:42px;height:52px;border-radius:7px;background:linear-gradient(160deg,#ef4444,#f97316);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;flex:none}
.x{border:0;background:#fee2e2;color:#dc2626;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:800}
.lb{font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 6px}.seg{margin-bottom:10px}.seg.g2 button,.seg.g4 button{flex:1 1 0}
.ib{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed #e0e7ff}
.cp{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}.step{display:flex;align-items:center;background:#eef2ff;border-radius:12px;overflow:hidden}
.step button{border:0;background:none;width:38px;height:40px;font-size:20px;font-weight:700;color:var(--p);cursor:pointer}.step button:active{background:#ddd6fe}
.step input{width:48px;height:40px;margin:0;padding:0;border:0;border-radius:0;text-align:center;font-weight:700;background:#fff;-moz-appearance:textfield}.step input::-webkit-inner-spin-button{display:none}
.pr{text-align:right;display:flex;flex-direction:column}.pr b{font-size:22px;color:var(--p)}
.stat{padding:18px;border-radius:18px;color:#fff;animation:pop .6s var(--e) both;box-shadow:0 10px 24px rgba(79,70,229,.25)}.stat b{font-size:28px;display:block}
.s1{background:linear-gradient(135deg,var(--b),#60a5fa)}.s2{background:linear-gradient(135deg,var(--p),#a78bfa)}.s3{background:linear-gradient(135deg,#4f46e5,#7c3aed)}.s4{background:linear-gradient(135deg,#0ea5e9,var(--b))}
.rates span{display:inline-block;background:#ede9fe;color:var(--p);padding:6px 12px;border-radius:20px;margin:3px;font-weight:600;font-size:13px}
.shopc{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #e0e7ff;border-radius:16px;padding:12px 14px;margin-top:12px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--p));color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 14px rgba(124,58,237,.35)}
.si{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px}.si b{font-size:16px}.si em{color:var(--mut);font-style:normal;font-size:12px}
.sb{display:flex;flex-direction:column;gap:6px}.sb .btn{text-align:center;white-space:nowrap}.btn.del{background:linear-gradient(90deg,#ef4444,#f97316);box-shadow:none}
.btn.wa{background:linear-gradient(90deg,#16a34a,#22c55e)}
.shopc{position:relative;overflow:hidden;animation:pop .6s var(--e) backwards;transition:transform .3s var(--e),box-shadow .3s}.shopc:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(124,58,237,.22)}
.shopc::after{content:"";position:absolute;top:0;left:-40%;width:28%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shim 4.5s 1.2s infinite;pointer-events:none}
.av{animation:ring 2s infinite}.si>*{animation:slideR .6s var(--e) backwards}.si>:nth-child(2){animation-delay:.12s}.si>:nth-child(3){animation-delay:.24s}
.ph{display:inline-block;font-style:normal;transform-origin:50% 60%;animation:shake 3s infinite}
.sb .btn:first-child{animation:glow 2s infinite}.sb .btn.wa{animation:bob 3s ease-in-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(124,58,237,.55)}70%,100%{box-shadow:0 0 0 14px rgba(124,58,237,0)}}
@keyframes slideR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes shake{0%,55%,100%{transform:rotate(0)}60%{transform:rotate(-20deg)}65%{transform:rotate(18deg)}70%{transform:rotate(-14deg)}75%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(37,99,235,.18)}}
@keyframes shim{to{left:130%}}
@media(max-width:480px){.shopc{flex-wrap:wrap}.sb{flex-direction:row;width:100%}.sb .btn{flex:1}}
.total{font-size:34px;font-weight:800;color:var(--p)}
.tag{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block}
.pending{background:#fef3c7;color:#b45309;animation:pulse 1.6s infinite}.done{background:#dcfce7;color:var(--ok)}.paid{background:#dbeafe;color:var(--b)}.unpaid{background:#fee2e2;color:#dc2626}
.bar{height:12px;background:#e0e7ff;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--p));transition:width 1.2s var(--e)}
.hide{display:none!important}.err{background:#fee2e2;color:#b91c1c;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.pay{display:flex;gap:10px;flex-wrap:wrap}.pay label{flex:1;min-width:130px;border:2px solid #e0e7ff;border-radius:14px;padding:13px;cursor:pointer;color:var(--ink)}.pay input{width:auto;margin:0 6px 0 0}.pay label:has(input:checked){border-color:var(--p);background:#f5f3ff}
#qr{display:inline-block;padding:10px;background:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.pc{text-align:center;background:#f8faff;border-radius:16px;padding:14px}.pie{width:150px;height:150px;margin:10px auto;display:block;filter:drop-shadow(0 6px 12px rgba(79,70,229,.2))}.lg{font-size:13px;text-align:left;display:inline-block}.lg div{margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
@keyframes dsh{from{stroke-dasharray:0 160}}
.bcw{text-align:center;background:#fff;border:1px dashed #c7d2fe;border-radius:10px;padding:8px;margin:6px 0}.bcw svg{max-width:100%;height:44px}.bcn{font-weight:800;letter-spacing:2px;font-size:13px;margin-top:2px}
.oc{border:2px solid #eef2ff;border-radius:16px;padding:14px;margin-bottom:12px;background:#fff;animation:up .5s var(--e) both}
.oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.oh b{font-size:16px;margin-right:auto}
.fl{background:#f8faff;border-radius:12px;padding:10px;margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg{background:#fef9c3;border-left:4px solid #eab308;padding:10px;border-radius:8px;margin:8px 0}
.oa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.oa>b{margin-right:auto;font-size:18px}
.oid{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--p);background:#f5f3ff;border-radius:14px;padding:10px;margin:10px 0 4px;display:inline-block}
.big{width:70px;height:70px;border-radius:50%;margin:0 auto 10px;background:var(--ok);color:#fff;font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center;animation:pop .5s var(--e)}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}td{padding:9px 6px;border-bottom:1px solid #eef2ff}
.auth{display:flex;justify-content:center;align-items:center;min-height:80vh}
.split{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:1000px;min-height:620px;background:#fff;border:6px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(79,70,229,.3);animation:up .7s var(--e) both}
.lp{padding:30px 44px;display:flex;flex-direction:column;justify-content:center}
.lg0{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin-bottom:22px}.lg0 span{background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;color:transparent}
.wt{font-size:34px;margin:0 0 4px;letter-spacing:-1px}
.rf{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 14px}.rm{display:flex;align-items:center;gap:6px;cursor:pointer}.rm input{width:auto;margin:0}
.bt{display:flex;gap:12px}.bt .btn{flex:1;padding:13px 8px}.btn.out{background:#fff;color:var(--p);border:2px solid var(--p);box-shadow:none}
.terms{font-size:11px;color:var(--mut);margin:18px 0 0}
.rp{position:relative;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.25),transparent 40%),linear-gradient(160deg,#2563eb,#7c3aed 60%,#a78bfa);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;color:#fff;text-align:center;overflow:hidden}
.rg b{font-size:26px;display:block;letter-spacing:-.5px}.rg span{font-size:14px;opacity:.9}.rp .prn{margin:6px auto;flex:none}
.rp .rates span{background:rgba(255,255,255,.2);color:#fff}.gl{width:100%}.rp .shopc{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;text-align:left}.rp .si em{color:#e0e7ff}
.rp .btn{background:#fff;color:var(--p)}.rp .btn.wa{background:#22c55e;color:#fff}
.seam{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:0;background:#facc15;color:var(--ink);font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:4;transition:.3s}.seam:hover{transform:translate(-50%,-50%) scale(1.12)}
.onlym{display:none}
@media(max-width:820px){.split{grid-template-columns:1fr;border-width:4px;border-radius:22px;min-height:0}.rp,.seam{display:none}.lp{padding:24px 18px}.onlym{display:block;margin-bottom:12px}.wt{font-size:28px}}
.hero h1{font-size:44px;line-height:1.05;margin:0 0 14px;background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;color:transparent}.hero p{color:var(--mut);font-size:17px;max-width:380px}
.prn{position:relative;width:300px;height:270px;margin-top:20px}
.pbody{position:absolute;top:30px;left:30px;width:230px;height:92px;border-radius:24px;background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 20px 34px rgba(79,70,229,.35);z-index:3;animation:bob 3s ease-in-out infinite}
.slot{position:absolute;left:28px;right:28px;top:22px;height:10px;border-radius:6px;background:#1e1b4b}
.led{position:absolute;right:22px;bottom:16px;width:10px;height:10px;border-radius:50%;background:#4ade80;animation:blink 1s infinite}
.pl{position:absolute;left:28px;bottom:14px;color:#e0e7ff;font-size:11px;font-weight:800;letter-spacing:2px}
.sheet{position:absolute;left:62px;top:30px;width:166px;height:190px;background:#fff;border-radius:6px 6px 10px 10px;box-shadow:0 10px 24px rgba(79,70,229,.25);z-index:2;padding:34px 14px 0;animation:feed 4.5s ease-in-out infinite}
.sheet s{display:block;height:8px;border-radius:4px;background:#c7d2fe;margin:0 0 12px;width:100%}.sheet s:nth-child(1){width:70%}.sheet s:nth-child(3){width:85%}.sheet s:nth-child(4){width:55%}
.prn i{font-style:normal;position:absolute;font-size:30px;animation:bob 3s ease-in-out infinite}.fi1{left:0;top:150px}.fi2{right:0;top:70px;animation-delay:-1s!important}.fi3{right:10px;top:200px;animation-delay:-2s!important}.fi4{left:10px;top:0;animation-delay:-1.5s!important}
.prn .led{font-size:0;animation:blink 1s infinite}
@keyframes feed{0%{transform:translateY(-150px);opacity:1}50%,85%{transform:translateY(24px);opacity:1}100%{transform:translateY(24px);opacity:0}}
@keyframes blink{50%{opacity:.25}}
.pstack{height:110px;position:relative;margin-top:24px}.paper{position:absolute;bottom:0;width:60px;height:78px;background:#fff;border-radius:6px;box-shadow:0 6px 16px rgba(79,70,229,.18);border-top:6px solid var(--p);animation:sheet 4s ease-in-out infinite}
.paper:nth-child(2){left:70px;animation-delay:1.3s;border-top-color:var(--b)}.paper:nth-child(3){left:140px;animation-delay:2.6s}
.sw{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sw label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;color:var(--ink)}
.sw input{display:none}.sw .tg{width:46px;height:26px;border-radius:20px;background:#cbd5e1;position:relative;transition:.3s}.sw .tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s}
.sw input:checked+.tg{background:linear-gradient(90deg,var(--b),var(--p))}.sw input:checked+.tg::after{transform:translateX(20px)}
#upl{position:fixed;inset:0;background:rgba(30,27,75,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:20}
.ub{background:#fff;border-radius:22px;padding:30px 36px;text-align:center}.spin{width:50px;height:50px;border-radius:50%;border:5px solid #e0e7ff;border-top-color:var(--p);margin:0 auto 12px;animation:rot .9s linear infinite}
#toast{position:fixed;bottom:-80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:30px;opacity:0;transition:.5s var(--e);z-index:30;max-width:92%;text-align:center}#toast.show{opacity:1;bottom:24px}
@media(max-width:820px){.auth{grid-template-columns:1fr}.hero{display:none}}
@media(max-width:600px){.seg.g4{display:grid;grid-template-columns:1fr 1fr}.ib{flex-wrap:wrap}.pr{margin-left:auto}main{margin:14px auto;padding:0 10px}.card{padding:16px;border-radius:16px}.seg button,.tabs button{font-size:13px;padding:9px 4px}#st{grid-template-columns:1fr 1fr}.stat b{font-size:22px}.oa .btn,.fl .btn{flex:1;text-align:center}.total{font-size:28px}.logo{font-size:19px}}
/* ===== Admin: files table ===== */
.ft{overflow-x:auto;margin:10px 0;border:1px solid #e0e7ff;border-radius:14px;background:#fff}
.ft table{min-width:1020px;font-size:13px}
.ft th{background:#eef2ff;color:var(--mut);font-size:12px;padding:9px 8px;text-align:left;white-space:nowrap}
.ft td{padding:9px 8px;vertical-align:middle}
.ft td.n{text-align:center;font-weight:700}
.ft td.fn{max-width:200px;word-break:break-word}
.ft tfoot td{background:#f5f3ff;font-weight:800;border-bottom:0}
/* ===== Admin dashboard layout ===== */
main.wide{max-width:none;margin:0;padding:0}
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.sd{background:#fff;border-right:1px solid #eef2ff;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.sd .lg0{margin-bottom:10px}
.shopbox{display:flex;gap:10px;align-items:center;border:1px solid #e0e7ff;border-radius:12px;padding:8px 10px;margin:0 0 14px;font-weight:700;font-size:14px}
.ca{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--p));color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.sd .mi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;font-weight:600;color:#475569;cursor:pointer;text-align:left;font-size:14px;width:100%}
.sd .mi:hover{background:#f8faff}.sd .mi.on{background:#f5f3ff;color:var(--p)}
.sd .mt{padding:0 6px;margin:4px 0}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid #eef2ff;min-width:0}
.me div:last-child{min-width:0;font-size:13px}.me small{display:block;white-space:normal;overflow-wrap:anywhere;font-size:11.5px;line-height:1.3}
.ac{padding:22px 24px;min-width:0}
.ah{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ah h2{font-size:26px;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{margin:0;width:240px;padding:9px 12px;font-size:14px}
.tools .seg{margin:0;padding:3px}.tools .seg button{padding:8px 12px;font-size:13px}
.sc4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:16px}
.sk{background:#fff;border:1px solid #eef0f6;border-radius:14px;padding:14px 16px;animation:pop .5s var(--e) both;min-width:0}
.sk>small{display:block;font-weight:600}

    for(let i=Math.max(a,1);i<=Math.min(b,n+500);i++){if(i<=n)o.add(i);else if(bad)bad.push(i)}});return o}

    np=new Set([...A,...D,...B]).size;ov=c+d+b-np;

  else{const S=it.sel==='range'?parse(it.pr,n,bad):parse('all',n);np=S.size;if(it.mode==='color')c=np;else if(it.mode==='duplex')d=np;else b=np;

  it.np=np;it.c=c;it.d=d;it.b=b;it.ov=ov;it.bad=[...new Set(bad)].sort((x,y)=>x-y)}

async function setOpts(id,j,keys,val){
  const o=ADM.find(x=>x.id===id);if(!o||!Array.isArray(o.items)||!o.items.length)return toast('Old order – use the "Complete whole order" button');
  const items=o.items.map((x,i)=>{const dn={};KEYS(x).forEach(k=>dn[k]=optDone(o,x,k));if(i===j)keys.forEach(k=>dn[k]=val);return{...x,dn}});
  const st=items.every(x=>fileDone({},x))?'done':'pending';

const spark=(a,col)=>{const mx=Math.max(...a,1),pts=a.map((v,i)=>`${(i*(96/(a.length-1))).toFixed(1)},${(34-v/mx*30).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 96 36" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
async function loadAdmin(){
  const {data:d,error}=await db.from('orders').select('*').order('created_at',{ascending:false});
  if(error){const t=$('#tb');if(t)t.innerHTML='Could not load orders: '+esc(niceErr(error))+'<br><small>Run supabase_update.sql (it fixes the admin permission).</small>';return}

    if(ids.length){const r=await db.from('orders').update({status:'done'}).in('id',ids);if(!r.error)data.forEach(o=>{if(ids.includes(o.id))o.status='done'})}}
  ADM=data;regLocks(ADM);
  const sum=a=>a.reduce((s,o)=>s+ +o.amount,0),base=dayKey(new Date()),days=[6,5,4,3,2,1,0].map(i=>base-i*DAY);
  const ser=(fn,agg)=>days.map(t=>agg(data.filter(o=>dayKey(o.created_at)===t&&fn(o))));
  const sk=(l,arr,fmt,col)=>{const c=arr[6],p=arr[5],ch=p?Math.round((c-p)/p*100):null;
    return `<div class="sk"><small>${l}</small><div class="v"><b>${fmt(c)}</b>${spark(arr,col)}</div><small>${ch===null?'7-day trend':`<span class="chg ${ch>=0?'up':'dn'}">${ch>=0?'↑':'↓'} ${Math.abs(ch)}%</span> vs yesterday`}</small></div>`};
  const st=$('#st');
  if(st)st.innerHTML=sk("🛒 Today's orders",ser(()=>true,a=>a.length),v=>v,'#2563eb')+sk('💰 Today total',ser(()=>true,sum),rs,'#7c3aed')+sk('✅ Payment received',ser(o=>o.pay_status==='paid',sum),rs,'#16a34a')+sk('⏳ Pending prints',ser(o=>o.status!=='done',a=>a.length),v=>v,'#f59e0b');
  const pies=$('#pies');
  if(pies){const td=data.filter(o=>dayKey(o.created_at)===base),dn=td.filter(o=>o.status==='done').length,pd=td.filter(o=>o.pay_status==='paid');
    const pg=td.reduce((a,o)=>{fileOf(o).forEach(x=>{a[0]+=(+x.c||0)*cp(x,'c');a[1]+=(+x.b||0)*cp(x,'b');a[2]+=(+x.d||0)*cp(x,'d')});return a},[0,0,0]);
    pies.innerHTML=pie(`✅ Print status (${dn}/${td.length})`,[{l:'Done',v:dn,c:'#16a34a'},{l:'Not completed',v:td.length-dn,c:'#f59e0b'}],v=>v)
     +pie('💰 Payment',[{l:'Received',v:sum(pd),c:'#2563eb'},{l:'Pending',v:sum(td)-sum(pd),c:'#ef4444'}],rs)
     +pie('🖨️ Pages printed',[{l:'Colour',v:pg[0],c:'#7c3aed'},{l:'B&W',v:pg[1],c:'#2563eb'},{l:'Both-side',v:pg[2],c:'#a78bfa'}],v=>v)}
  renderOrders();

let visIds=[];
function renderOrders(){

    <td data-l="Items">${fs.length} file${fs.length>1?'s':''}<br><small>${+o.total_pages||0} pg</small></td>
    <td data-l="Amount"><b>${rs(o.amount)}</b></td>

    <div class="oa"><b>${rs(o.amount)} · ${cash?'💵 Cash':'📱 UPI'}</b><button class="btn sm ghost" onclick="printSlips([ADM.find(x=>x.id==='${o.id}')])">🖨️ Barcode &amp; QR</button>${o.pay_status!=='paid'?(cash?pb(o,'Cash','💵','Cash received',1)+pb(o,'UPI','📱','UPI received'):pb(o,'UPI','📱','UPI received',1)+pb(o,'Cash','💵','Cash received')):''}
    ${dn?`<button class="btn sm ghost" onclick="upd('${o.id}',{status:'pending'})">↩️ Undo all</button><button class="btn sm del" onclick="delOne('${o.id}')">🗑️ Delete</button>`:`<button class="btn sm" onclick="upd('${o.id}',{status:'done'})">✅ Complete whole order</button>`}</div></td></tr>`;

<script>
(function(){
  var s=document.getElementById('splash'),t0=Date.now(),done=false;
  function hide(){
    if(done)return;done=true;
    var wait=Math.max(0,1400-(Date.now()-t0));   /* show at least 1.4 seconds */
    setTimeout(function(){s.classList.add('out');setTimeout(function(){s.remove()},700)},wait);
  }
  window.addEventListener('load',function(){setTimeout(hide,200)});
  setTimeout(hide,6000);   /* safety: never stuck */
})();
